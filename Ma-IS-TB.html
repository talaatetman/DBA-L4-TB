<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك اسئلة نظم وتكنولوجيا المعلومات التسويقية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        :root { --primary-color: #5145BA; --success-color: #28a745; --error-color: #dc3545; --bg-color: #f4f4f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--primary-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background: white; width: 100%; max-width: 570px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: none; }
        .container.active { display: block; }
        h2 { color: var(--primary-color); margin-bottom: 20px; text-align: center; }
        .setting-group { margin-bottom: 20px; }
        .group-label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 0.95rem; }
        .grid-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .chip { padding: 10px; border: 2px solid #ddd; background: white; cursor: pointer; border-radius: 8px; transition: 0.3s; text-align: center; font-weight: 500;}
        .chip.active { border-color: var(--primary-color); background: #EEF2FF; color: var(--primary-color); font-weight: 900; }
        input { width: 100%; padding: 12px; border: 2px solid #EDF2F7; border-radius: 12px; font-size: 1rem; margin-top: 5px; outline: none; }
        .max-hint { display: block; font-size: 0.8rem; color: #718096; margin-top: 5px; }
        .start-btn { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 20px; }
        .question-block { margin-bottom: 25px; }
        .question-text { font-size: 1.2rem; margin-bottom: 20px; color: #444; font-weight: bold; line-height: 1.4; }
        .option-item { padding: 14px; border: 2px solid #EDF2F7; margin-bottom: 10px; border-radius: 12px; cursor: pointer; }
        .option-item.correct { background: #C6F6D5; border-color: #48BB78; color: #22543D; }
        .option-item.incorrect { background: #FED7D7; border-color: #F56565; color: #742A2A; }
        .option-item.selected-temp { border-color: var(--primary-color); background: #EBF4FF; }
        .locked { pointer-events: none; }
    </style>
</head>
<body>
    <div id="setup-screen" class="container active">
        <h2> بنك اسئلة نظم وتكنولوجيا المعلومات التسويقية</h2>
        <div class="setting-group">
            <span class="group-label">اختر القسم:</span>
            <div class="grid-options" id="category-selector">
                <button class="chip active" data-value="all">المنهج كامل</button>
                <button class="chip" data-value="drs">أسئلة د سيد جاد</button>
                <button class="chip" data-value="dry">أسئلة د يسر عزام</button>

            </div>
        </div>
        <div class="setting-group">
            <span class="group-label">نظام الأسئلة:</span>
            <div class="chip-grid" id="order-selector">
                <button class="chip active" data-value="fixed">ثابت (كل اسئلة القسم المختار)</button>
                <button class="chip" data-value="random">ترتيب عشوائى (ادخل عدد الاسئلة)</button>
            </div>
        </div>
        <div id="num-section" class="setting-group" style="display: none;">
            <span class="group-label">العدد:</span>
            <input type="number" id="num-input">
            <span class="max-hint" id="max-label"></span>
        </div>
        <div class="setting-group">
            <span class="group-label">النمط:</span>
            <div class="chip-grid" id="mode-combined">
                <button class="chip active" data-value="exam_all">اختبار (كل الاسئلة فى ورقة واحدة)</button>
                <button class="chip" data-value="study_one">مذاكرة (عرض سؤال بسؤال)</button>
            </div>
        </div>
        <button class="start-btn" onclick="initQuiz()">ابدأ المراجعة</button>
    </div>

    <div id="quiz-screen" class="container">
        <div id="quiz-content"></div>
        <button id="submit-btn" class="start-btn" style="display:none" onclick="handleFullSubmit()">إنهاء</button>
        <button id="next-btn" class="start-btn" style="display:none" onclick="nextQuestion()">التالي</button>
        <p id="q-counter" style="text-align:center; margin-top:10px;"></p>
    </div>

    <div id="result-screen" class="container">
        <h2 id="res-title">النتيجة</h2>
        <p id="res-msg" style="text-align:center; font-size:1.5rem;"></p>
        <div id="mistakes-report"></div>
        <button class="start-btn" onclick="location.reload()">العودة</button>
    </div>

    <script>
        const db = [{"cat":"drs","q":"نظام تشغيل البيانات يتكون من مجموعة من الإجراءات والخطوات بهدف الحصول على المعلومات لاتخاذ القرارات الادارية الرشيدة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"مخرجات نظام تشغيل البيانات يتم تقييمها قبل اتخاذ القرارات الادارية وأي انحرافات يتم أخذها في الحسبان عند تغذية النظام بمجموعة البيانات الجديدة.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"التقارير والمذكرات والسجلات التي يقوم الأفراد بتنظيمها وإعداد بياناتها وتبويبها وتجميعها للاستفادة منها تعتبر تشغيلا يدويا للبيانات.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تعتمد الطريقة الميكانيكية في تشغيل البيانات على بعض الماكينات والمعدات في إعداد البيانات مثل الآلات الكاتبة وآلات الفرز والتوثيق.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"المزايا المرتبطة بتشغيل البيانات باستخدام الحاسب الآلي لا تبرر استخدام الحاسبات الإلكترونية في أي منظمة لأن ذلك مرهون باعتبارات كثيرة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تشغيل البيانات يكون مهتما بإنتاج المعلومات لكل مستويات المنظمة أما نظام المعلومات الادارية فيكون موجها لاستخدام واستعمال هذه المعلومات.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"نظام تشغيل البيانات يخدم الأهداف الطويلة والمتوسطة الأجل بينما نظام المعلومات الإدارية يعمل في الأجل القصير.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"قيمة المعلومات هي قيمة التغير في سلوك القرار المستند إلى هذه المعلومات مخصوما منها تكلفة هذه المعلومات.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"هناك علاقة غير تكاملية بين نظام المعلومات الرئيسي في المنظمة ونظم المعلومات الفرعية كالتسويقية، والمالية، والإنتاجية، وغيرها.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"ترتبط المفاهيم والاتجاهات الحديثة في فعاليتها ونجاحها بنجاح نظم المعلومات الادارية خاصة المعتمدة على الحواسب الآلية.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يُقصد بالاتصال الإيمائي استخدام الكلمات المكتوبة والتقارير الدورية لتوصيل التوجيهات والقرارات بين المستويات الإدارية المختلفة.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"تزداد كفاءة عملية الاتصال داخل المنظمة كلما نجح المرسل في تقليل التشويش وضمان وصول الرسالة وفهمها بدقة من قِبل المستقبل.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يُعتبر مصطلح \"نظام الاتصال\" المسمى الأكثر شمولاً لأنه ينظر للاتصال كمنظومة متكاملة تحتوي على مدخلات، عمليات، مخرجات، وتغذية عكسية.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تقتصر معوقات الاتصال في بيئة العمل على المشكلات التقنية وفشل شبكات الإنترنت، ولا علاقة لها بالعوامل النفسية أو الاختلافات الثقافية للأفراد.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يمثل الاتصال عنصراً محورياً في الإدارة، حيث يعتمد نجاح وظائف التخطيط، والتنظيم، والتوجيه، والرقابة بشكل أساسي على كفاءة قنوات الاتصال.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"أتاح الاعتماد على نظم الاتصال الحديثة والاتصال عن بُعد لمنظمات الأعمال مرونة أكبر في إدارة عملياتها وتنسيق الجهود دون التقيد بالحدود الجغرافية.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يؤدي انتشار وشيوع شبكات الإنترنت والأقمار الصناعية إلى تقليل التداخل والتبادل الثقافي بين الدول، مما يجعل المجتمعات أكثر انغلاقاً على نفسها.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"تعتبر \"التغذية العكسية\" خطوة ثانوية في عملية الاتصال، حيث يمكن للمرسل التأكد من تحقيق هدف الرسالة بمجرد إرسالها دون الحاجة لاستجابة المستقبل.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يتميز الاتصال المباشر (وجهاً لوجه) بقدرته العالية على نقل المشاعر والرسائل غير اللفظية بدقة، مما يقلل من احتمالية سوء الفهم بين أطراف الاتصال.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"غياب قنوات الاتصال الصاعدة والفعالة داخل المنشأة يُعد من أبرز الأسباب التي تؤدي إلى فشل الإدارة في معرفة مشاكل الموظفين ومقترحاتهم.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تُعتبر عملية صنع القرار الإداري جزءاً هاماً ورئيسياً يعكس كفاءة الإدارة وقدرتها على توجيه المنظمة نحو أهدافها.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تتطابق عملية صنع القرار في حالة المخاطرة تماماً مع حالتي التأكد والغموض التام، حيث تتوفر في جميعها نفس نسبة المعلومات الإحصائية.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"في حالة الغموض، يواجه متخذ القرار نقصاً حاداً في المعلومات والبيانات، مما يجعل من الصعب وضع احتمالات دقيقة للنتائج المتوقعة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يُفضل اتخاذ القرارات عن طريق الجماعة دائماً وفي كل الحالات الإدارية دون استثناء، بغض النظر عن عامل الوقت أو التكلفة.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يساعد اتخاذ القرار الجماعي في توليد أفكار وبدائل متنوعة ومتعددة مقارنة بالقرارات التي يتخذها الفرد بمفرده.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"من عيوب اتخاذ القرارات بطريقة جماعية أنها قد تستغرق وقتاً أطول وتؤدي أحياناً إلى تشتت المسؤولية بين أعضاء المجموعة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يصف نموذج \"فروم - جاكو\" خمسة أنماط مختلفة للقرار، تبدأ من النمط الفردي الاستبدادي وتتدرج حتى النمط الجماعي المشارك.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يمكن للمديرين الاختيار بين أنماط نموذج \"فروم - جاكو\" بناءً على طبيعة المشكلة، وأهمية قبول القرار، والوقت المتاح لاتخاذه.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تقتصر الأساليب المستخدمة لتحسين كفاءة وإبداع المدير في صنع القرارات على التخمين الشخصي، ولا توجد أساليب علمية منظمة لذلك.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"تتكون عملية اتخاذ القرارات من عدة مراحل متتابعة تبدأ بتحديد المشكلة وتشخيصها، وتنتهي بمتابعة وتقييم تنفيذ القرار البديل.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يُعتبر قرار اختيار قنوات التوزيع مثالاً على القرارات المبرمجة والروتينية اليومية التي لا تتطلب تفكيراً عميقاً.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يُصنف قرار اختيار موقع لمشروع صناعي كبير أو مكتب تجاري كقرار استراتيجي غير مبرمج نظراً لتعقيده وتأثيره طويل المدى على المنظمة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تُعد القرارات المبرمجة قرارات تكرارية وروتينية يتم التعامل معها وفقاً لإجراءات وقواعد وسياسات محددة مسبقاً داخل المنظمة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"القرارات غير المبرمجة هي قرارات فريدة وغير متكررة، وتعمل عادةً مع مشكلات معقدة وغير واضحة المعالم تتطلب حلولاً مبتكرة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يُعتبر قرار نزهة آخر الأسبوع أو زيارة قريب لك من أمثلة القرارات الشخصية واليومية البسيطة التي لا تخضع لتعقيدات الهياكل الإدارية.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"الندم على اتخاذ قرار معين في الماضي يعني بالضرورة أن عملية اتخاذ القرار كانت خاطئة في وقتها، حتى لو كانت البيانات المتاحة حينها ممتازة.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"مرحلة تقييم البدائل واختيار البديل الأمثل هي الخطوة الأولى التي يجب على المدير البدء بها قبل تحديد طبيعة المشكلة الأساسية.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يساعد استخدام أسلوب \"العصف الذهني\" الجماعي في تحسين كفاءة وإبداع عملية صنع القرار الإداري من خلال تشجيع تدفق الأفكار دون نقد مبكر.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"كلما زادت درجة المخاطرة والغموض المحيطة بالمشكلة، كلما قلّت الحاجة لجمع المعلومات واقتصر الاعتماد على حدس المدير فقط.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يهدف نموذج \"فروم - جاكو\" للقيادة وصنع القرار إلى مساعدة القادة على تحديد درجة المشاركة المناسبة للمرؤوسين في عملية اتخاذ القرار.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تُعتبر إدارة عمليات التكنولوجيا من العناصر الاستراتيجية والمحددة لكفاءة الإدارة العليا في المنظمة.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"يجب أن تُحسم القرارات الخاصة بالآلية والأتمتة على المستويات التشغيلية الدنيا فقط دون تدخل المستويات الاستراتيجية في المنظمة.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"من الضروري ربط التكنولوجيا المطلوبة بالاستراتيجيات العامة للمنظمة، سواء كان ذلك في الأجل الطويل أو المتوسط أو حتى القصير.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تتميز التكنولوجيا المتقدمة والآلية بأنها تحقق مزايا جوهرية وفوائد متزايدة، وخلوّها التام والكامل من أي جوانب سلبية.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يقع على عاتق إدارة المنظمة مسؤولية تعظيم كفاءة استخدام التكنولوجيا للتقليل من آثار جوانبها السلبية.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"تساهم التقنيات العالية بشكل مباشر في تحقيق القدرات والميزات التنافسية المستدامة لمنظمات الأعمال.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"إن قرار الاختيار والمفاضلة بين الآليات التكنولوجية المتاحة يمكن اتخاذه عشوائياً دون الحاجة إلى دراسة وبحث وتحليل.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يتطلب قرار المفاضلة التكنولوجية استخدام أساليب متقدمة في التحليل المالي وتقييم المقترحات الاستثمارية وغيرها.","opts":["صح","خطأ"],"ans":0},{"cat":"drs","q":"في جميع الأحوال، يتقبل العاملون في المنظمة إدخال الأساليب الآلية (الأتمتة) بحماس شديد ودون أي معارضة تذكر.","opts":["صح","خطأ"],"ans":1},{"cat":"drs","q":"يُعد علاج معارضة العاملين للأتمتة والتعامل معها بنجاح من صميم القدرات والمهارات الإبداعية للقيادة العليا في المنظمة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تشير الدراسات إلى أن %90 من نجاح قرارات الإدارة يعتمد على قدرات ومهارات متخذ القرار بينما %10 فقط تعتمد على المعلومات.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"يقصد بـ \"التوقيت\" كأحد أبعاد المضمون للمعلومات توفير المعلومات في الزمن المناسب لمتخذ القرار.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعرف \"الشمولية\" بأنها قدرة المعلومات على إعطاء صورة كاملة عن المشكلة مع تقديم بدائل الحلول المختلفة دون الوقوع في مشكلة الإغراق.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يتم التأكد من جودة مخرجات النظام من خلال مقارنة المخرجات بمعايير محددة مسبقاً للأداء ثم تغذية النظام بنتائج هذه المقارنة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تمثل نظم المعلومات التسويقية الأفراد والمعدات والإجراءات التي تعمل سوية لتزويد صانعي القرار التسويقي بالمعلومات.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تتميز المعلومات المستمدة من سجلات الشركة الداخلية ببطئها الشديد وارتفاع تكلفتها مقارنة بالمصادر الخارجية.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعرف \"الاستخبارات التسويقية\" بأنها البيانات اليومية التي تتعلق بالتطورات البيئية التسويقية التي تساعد المديرين في إعداد وتعديل الخطط التسويقية.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تهدف البحوث الاستطلاعية أساساً إلى اختبار الفرضيات التي تتعلق بسبب العلاقات وتأثير المتغيرات على السلوك التسويقي.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"يعرف البحث الوصفي أيضاً بالبحث الإحصائي ويهدف إلى وصف بيانات وخصائص ما هو قيد الدراسة والإجابة عن الأسئلة (من، ماذا، أين، متى، كيف).","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تشمل مجالات بحوث التسويق: بحوث المنتجات، بحوث المستهلكين، بحوث تنظيم المبيعات، بحوث مسالك التوزيع، وبحوث الإعلان.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعتبر البيانات الثانوية دائما كافية وحدها لحل جميع مشكلات البحث التسويقي دون الحاجة المطلقة للبيانات الأولية.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعد المصادر الحكومية والبنك المركزي والنشرات والكتب من مصادر البيانات الثانوية الخارجية.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يعتبر الاتصال المباشر (المقابلة الشخصية) لجمع البيانات الأولية من أقل الطرق دقة وأسوئها في تفسير الأسئلة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"يتم استخدام برنامج SPSS الإحصائي حصرياً في مرحلة تحديد المشكلة وصياغة الفرضيات في البحوث التسويقية.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"لا يشترط وجود مشكلة قائمة بالفعل لكي تقوم المنظمة بإجراء بحث تسويقي، فقد يكون البحث مووجهاً لمعرفة فرص تسويقية معينة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعرف الفرضيات في البحوث التسويقية بأنها كافة المسببات المحتملة التي أدت إلى حدوث المشكلة والتي يتطلب الأمر اختبار صحتها.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تتضمن خطوات إجراء البحوث التسويقية ست خطوات رئيسية تبدأ بتحديد المشكلة و تنتهي بكتابة التقرير.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعتمد البحوث السببية على إيجاد علاقة سببية بين متغيرين مثل زيادة المبيعات نتيجة تغيير شكل المنتج أو تحسين جودته.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعد الاستخبارات التسويقية أمراً غير ضروري على الإطلاق عند التفكير في دخول الأسواق الأجنبية.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"من عيوب استخدام الهاتف لجمع البيانات الأولية عدم معرفة حركات الجسد المصاحبة للحديث وإمكانية التهرب من الإجابة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تتضمن بحوث مسالك التوزيع التعرف على أفضل منافذ البيع والتوزيع وقياس كفاءة وكلاء البيع في المناطق المختلفة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تُعد مرحلة تنقيح البيانات واستبعاد الإجابات الخاطئة والناقصة سابقة لمرحلة تحليلها بالأساليب الإحصائية والرياضية.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تقتصر المصادر الداخلية للبيانات الثانوية على البيانات المحاسبية وقوائم البيع فقط دون العاملين داخل المنظمة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تهدف بحوث الإعلان إلى التعرف على دوافع الشراء عند المستهلكين لتحديد وتصميم الرسالة الإعلانية المناسبة وإثارة دوافعهم.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يشير مفهوم تكنولوجيا المعلومات إلى جميع أنواع التكنولوجيا المستخدمة في تشغيل ونقل وتخزين المعلومات في شكل إلكتروني.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تقتصر القطاعات المستفيدة من تطبيق تكنولوجيا المعلومات في مجال السياحة على المسافرين فقط دون موردي الخدمات.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"من مزايا تكنولوجيا المعلومات تحسين كفاءة الإنتاج وتحسين نوعية الخدمات وخلق خدمات جديدة وممارسة الصناعة بطريقة أفضل.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تزيد احتمالات الوقوع في الخطأ عند استخدام النظم الآلية مقارنة بالنظم اليدوية التقليدية نتيجة الإجهاد البشري.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تتميز الحاسبات بقدرتها على استخدام المنطق البولياني في خيارات استرجاع المعلومات مما يمنحها مرونة عالية للوصول إلى أدق المعلومات.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعرف \"المعلومات\" بأنها المعطيات الأولية أو الخام من مثل الأرقام والصور المستوحاة من الواقع.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تمثل المعرفة ذات القيمة الأكبر والأعلى من حيث الدقة والثقة مقارنة بالبيانات والمعلومات، وتتميز بأن الجزء الأكبر منها قد يكون ضمنيا","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تنقسم المعرفة الضمنية إلى نوعين رئيسيين هما: البعد التقني (معرفة كيف) والبعد الإدراكي (النماذج الذهنية والإدراكات).","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تمثل المعرفة الصريحة تلك المعرفة التي تعتمد كلياً على الحدس الشخصي وال يمكن توثيقها ورقياً أو إلكترونياً بأي حال من الأحوال.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعد البيئة والمنظمات الرائدة والمنافسين والموردين والزبائن مصادر خارجية أساسية للحصول على المعرفة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تهدف استراتيجية المعرفة الهجومية إلى صيانة المعرفة في وضعها الأصلي والمحافظة عليها من النقل غير المصرح به والتركيز على النظام.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعد التحديات الثقافية والبنية الأساسية والتحديات الإدارية والتنظيمية من أبرز التحديات التي تواجه إدارة المعرفة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يعتمد مجتمع المعرفة (مجتمع ما بعد الرأسمالية) بشكل رئيسي على رأس المال المادي والخامات كموارد رئيسية بدلا من المعرفة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعرف إدارة المعرفة بأنها النشاط الذي يتم من خلاله الإستغلال الأمثل للمخزون المعرفي للمنظمة لرفع كفاءة أداء المنظمة ككل.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تقتصر استخدامات تكنولوجيا المعلومات في إحصاءات سوق العمل على جمع البيانات يدويًا دون الحاجة لنظم المعلومات الجغرافية GIS.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تتضمن متطلبات تطوير تكنولوجيا المعلومات تكوين رؤية تكنولوجية موحدة تربط التكنولوجيا باتخاذ القرارات وإنتاج المعلومات وعمليات التدريب.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تسهم تكنولوجيا المعلومات في تحقيق الميزة التنافسية الاستراتيجية عن طريق دعم اتخاذ القرار، تحسين عمليات الأعمال، وإعادة هندسة األعمال.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"لا توجد أي آثار إيجابية لتكنولوجيا المعلومات على الأداء العام للمنظمة أو على قدرتها في الإشراف على المشاريع في الفروع المختلفة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعتمد وظيفة الرقابة بناء على نظم تكنولوجيا المعلومات على قياس نتائج الأداء المتحقق ومقارنتها مع الأهداف المحددة لتحديد الانحرافات وطرائق معالجتها.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعد الاستخبارات في مجال الأعمال إحدى الفوائد التي تؤمنها تكنولوجيا المعلومات عن طريق الحصول على معلومات من الابتكار والأسواق والمنافسة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تؤدي أتمتة عمليات وأنشطة المنظمة اعتماداً على تطبيقات الحاسوب إلى زيادة التفاوت والتباين في مستوى الأداء ورفع التكاليف.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تشمل العوامل الوسيطة المؤثرة في العلاقة بين تكنولوجيا المعلومات والمنظمة كل من: البيئة، الثقافة التنظيمية، الهيكل التنظيمي، حجم المنظمة، وسياسات وممارسات الإدارة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تتلخص أهمية تكنولوجيا المعلومات في المنظمات في كونها مورداً مهمماً لتشكيل الأبعاد الأساسية للعملية الإدارية وتوليد ونقل المعرفة والاستغناء عن األعمال الورقية.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يقتصر تأثير تكنولوجيا المعلومات في الأفراد العاملين على زيادة معدل دوران العمل ورفع تكاليف تعيين موظفين جدد دون تأثير على رضاهم.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"يعد التدريب المكثف لمستخدمي التكنولوجيا الجديدة في جميع أقسام المنظمة متطلباً غير ضروري لنجاح نظام تكنولوجيا المعلومات.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"يُعرف نظام تكنولوجيا المعلومات (ITS) إجرائياً بأنه مجموعة الأجزاء المترابطة التي تشمل التسهيلات التكنولوجية والإجراءات الإدارية لجمع البيانات ومعالجتها وخزنها ونقلها.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"يمثل المكون البشري (الموارد البشرية) الجزء الأهم في نظام تكنولوجيا المعلومات، ويضم فئات التقنيين والمساندين والمستخدمين.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تقتصر الأجهزة والمعدات في نظم تكنولوجيا المعلومات على الحاسوب الرئيسي فقط دون الحاجة لأجهزة الإدخال والإخراج والشبكات.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعتبر \"برمجيات النظام\" مثل أنظمة التشغيل جزءاً لا يتجزأ من الحاسب ومعدة من قبل الشركات المصنعة لتنظيم علاقة وحدات الحاسب بعضها ببعض.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تشمل برمجيات التأليف البرامج المعنية بترجمة التعليمات والايعازات المكتوبة بلغات البرمجة ذات المستوى العالي إلى لغة الآلة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعرف \"البيانات\" بأنها مواد مصنفة جاهزة للاستخدام وتقدم إفادة مباشرة لمتخذ القرار دون الحاجة إلى عمليات معالجة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تشمل شبكات الاتصالات (Networks) جميع الوسائل التقنية التي تنقل البيانات من حاسوب إلى آخر مثل الإنترنت والإنترانت والإكسترانت.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تُعبر \"الإجراءات التنظيمية\" عن التعليمات التشغيلية وأدلة العمل (Manuals) الموجهة للأفراد لإستخدام نظام تكنولوجيا المعلومات في إطار تنظيمي وسري.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تشمل الإجراءات التنظيمية في نظم تكنولوجيا المعلومات إجراءات التشغيل، إجراءات حفظ واسترجاع البيانات المفقودة، الإجراءات الأمنية، وإجراءات التطوير.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"من تحديات تطبيق نظام تكنولوجيا المعلومات وجود \"التوقعات المبالغ فيها\" حيث تتصور المنظمات قدرة التكنولوجيا على حل جميع المشاكل وحدها دون موارد بشرية مؤهلة.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"لا تلاقي عملية تطبيق تكنولوجيا المعلومات وتغيير أساليب العمل أي مقاومة من الأفراد العاملين أو غير المتخصصين في المنظمة.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"لا يمكن لأى جزء من مكونات نظام تكنولوجيا المعلومات أن يعمل بمعزل عن الأجزاء الأخرى، إذ يفقد النظام اكتماله بفقدان أي جزء منها.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تقتصر البرمجيات التطبيقية على أنظمة التشغيل العامة ولا علاقة لها بتشغيل تطبيقات نمطية مثل جدول الرواتب أو تحليل المبيعات.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"لا توجد أي مخاطر أو مشاكل صحية مرتبطة بالاستخدام المفرط تكنولوجيا المعلومات من قبل المستخدمين والعاملين في المكاتب.","opts":["صح","خطأ"],"ans":1},{"cat":"dry","q":"تعد إجراءات التطوير ضمن الإجراءات التنظيمية مسؤولة عن توضيح احتياجات المستخدمين وتطوير التطبيقات لمواجهة تلك الاحتياجات.","opts":["صح","خطأ"],"ans":0},{"cat":"dry","q":"تعد أتمتة المكاتب القلب النابض في عمل مختلف المنظمات نظراً لمساهمتها في تسهيل انسيابية القرارات وإنجاز الأعمال بسرعة ودقة وبأقل تكلفة.","opts":["صح","خطأ"],"ans":0}];
        let state = { category: "all", order: "fixed", mode: "exam", view: "all", questions: [], score: 0, currentIdx: 0, mistakes: [] };

        function updateMaxHint() {
            const pool = (state.category === 'all') ? db : db.filter(q => q.cat === state.category);
            document.getElementById('max-label').textContent = "المتاح: " + pool.length;
            document.getElementById('num-input').max = pool.length;
            document.getElementById('num-input').value = pool.length;
        }

        document.querySelectorAll('.chip').forEach(btn => {
            btn.onclick = function() {
                this.parentElement.querySelector('.active').classList.remove('active');
                this.classList.add('active');
                const val = this.dataset.value;
                const pid = this.parentElement.id;
                if(pid === 'category-selector') { state.category = val; updateMaxHint(); }
                if(pid === 'order-selector') { 
                    state.order = val; 
                    document.getElementById('num-section').style.display = (val === 'random') ? 'block' : 'none';
                    updateMaxHint();
                }
                if(pid === 'mode-combined') {
                    state.mode = val.includes('exam') ? 'exam' : 'study';
                    state.view = val.includes('all') ? 'all' : 'one';
                }
            };
        });
        updateMaxHint();

        function initQuiz() {
            let pool = (state.category === 'all') ? [...db] : db.filter(q => q.cat === state.category);
            let num = (state.order === 'fixed') ? pool.length : (parseInt(document.getElementById('num-input').value) || pool.length);
            if(state.order === 'random') pool.sort(() => Math.random() - 0.5);
            state.questions = pool.slice(0, num);
            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            if(state.view === 'all') renderAll(); else showOne();
        }

        function renderAll() {
            const cont = document.getElementById('quiz-content');
            cont.innerHTML = '';
            state.questions.forEach((q, idx) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.innerHTML = '<div class="question-text">'+(idx+1)+'. '+q.q+'</div>';
                const optsDiv = document.createElement('div');
                q.opts.forEach((opt, oIdx) => {
                    const div = document.createElement('div');
                    div.className = 'option-item'; div.textContent = opt;
                    div.onclick = () => {
                        if(optsDiv.classList.contains('locked')) return;
                        if(state.mode === 'study') {
                            optsDiv.classList.add('locked');
                            if(oIdx === q.ans) div.classList.add('correct');
                            else { div.classList.add('incorrect'); optsDiv.children[q.ans].classList.add('correct'); }
                        } else {
                            optsDiv.querySelectorAll('.option-item').forEach(s => s.classList.remove('selected-temp'));
                            div.classList.add('selected-temp');
                        }
                        q.userAns = oIdx;
                    };
                    optsDiv.appendChild(div);
                });
                block.appendChild(optsDiv);
                cont.appendChild(block);
            });
            document.getElementById('submit-btn').style.display = 'block';
        }

        function showOne() {
            const q = state.questions[state.currentIdx];
            const cont = document.getElementById('quiz-content');
            cont.innerHTML = '<div class="question-text">'+q.q+'</div><div id="opts"></div>';
            document.getElementById('q-counter').textContent = 'سؤال ' + (state.currentIdx+1) + ' من ' + state.questions.length;
            q.opts.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option-item'; div.textContent = opt;
                div.onclick = () => {
                    const optsDiv = document.getElementById('opts');
                    if(optsDiv.classList.contains('locked')) return;
                    optsDiv.classList.add('locked');
                    if(i === q.ans) { div.classList.add('correct'); state.score++; }
                    else { div.classList.add('incorrect'); optsDiv.children[q.ans].classList.add('correct'); state.mistakes.push({q:q.q, a:q.opts[q.ans]}); }
                    document.getElementById('next-btn').style.display = 'block';
                };
                document.getElementById('opts').appendChild(div);
            });
        }

        function nextQuestion() {
            state.currentIdx++;
            if(state.currentIdx < state.questions.length) { showOne(); document.getElementById('next-btn').style.display='none'; }
            else showResult();
        }

        function handleFullSubmit() {
            if(state.mode === 'exam') {
                state.score = 0; state.mistakes = [];
                state.questions.forEach(q => {
                    if(q.userAns === q.ans) state.score++;
                    else state.mistakes.push({q:q.q, a:q.opts[q.ans]});
                });
            }
            showResult();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            document.getElementById('res-msg').textContent = state.score + " / " + state.questions.length;
            const report = document.getElementById('mistakes-report');
            report.innerHTML = state.mistakes.map(m => '<div style="background:#FFF5F5; padding:10px; margin-bottom:10px; border-radius:8px; border-right:4px solid #F56565"><b>س:</b> '+m.q+'<br><span style="color:green"><b>الصح:</b> '+m.a+'</span></div>').join('');
        }
    </script>
</body>
